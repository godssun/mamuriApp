<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamuri — AI Diary Companion</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --text-secondary: #4A4A68;
      --accent: #5B5FC7;
      --border: #E8E8F0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F0F1A;
        --surface: #1A1A2E;
        --text: #E8E8F0;
        --text-secondary: #A0A0B8;
        --accent: #7B7FD7;
        --border: #2A2A3E;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      text-align: center;
      padding: 40px 24px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a {
      display: block;
      padding: 14px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.2s;
    }
    a:hover {
      border-color: var(--accent);
    }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mamuri</h1>
    <p>AI 일기 친구</p>
    <div class="links">
      <a href="/privacy">Privacy Policy / 개인정보 처리방침</a>
      <a href="/terms">Terms of Service / 이용약관</a>
    </div>
    <p class="footer">sunjunapps@gmail.com</p>
  </div>
</body>
</html>
