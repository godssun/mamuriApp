spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: mamuriApp

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms)

storage:
  provider: ${STORAGE_PROVIDER:local}

ai:
  provider: ${AI_PROVIDER:stub}
  prompt-version: ${AI_PROMPT_VERSION:v6}
  max-output-tokens: 180
  max-input-chars: 3000
  api:
    url: ${AI_API_URL:https://api.openai.com/v1}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-deluxe-monthly: ${STRIPE_PRICE_DELUXE_MONTHLY:}
  price-deluxe-yearly: ${STRIPE_PRICE_DELUXE_YEARLY:}
  price-premium-monthly: ${STRIPE_PRICE_PREMIUM_MONTHLY:}
  price-premium-yearly: ${STRIPE_PRICE_PREMIUM_YEARLY:}

feature:
  premium-enabled: ${FEATURE_PREMIUM_ENABLED:false}
  quota-enforcement-enabled: ${FEATURE_QUOTA_ENABLED:false}
  conversation-enabled: ${FEATURE_CONVERSATION_ENABLED:true}

# 앱 강제 업데이트 정책 — 플랫폼별 최소 지원 버전. 기본 0.0.0 은 "아무도 막지 않음".
# 운영 시 env 로 덮어써서 관리한다. 예: APP_FORCE_UPDATE_IOS_MIN=2.3.0
app:
  force-update:
    message: ${APP_FORCE_UPDATE_MESSAGE:}
    ios:
      minimum-supported-version: ${APP_FORCE_UPDATE_IOS_MIN:0.0.0}
      store-url: ${APP_IOS_STORE_URL:itms-apps://apps.apple.com/app/id6760908812}
    android:
      minimum-supported-version: ${APP_FORCE_UPDATE_ANDROID_MIN:0.0.0}
      store-url: ${APP_ANDROID_STORE_URL:market://details?id=com.junsapps.mamuri}

upload:
  dir: ${UPLOAD_DIR:uploads}
  base-url: ${UPLOAD_BASE_URL:http://localhost:8080}
  max-file-size: 5242880  # 5MB

admin:
  api-key: ${ADMIN_API_KEY:}
  default-email: ${ADMIN_DEFAULT_EMAIL:}
  default-password: ${ADMIN_DEFAULT_PASSWORD:}

rate-limit:
  auth:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: 5
    signup-per-minute: 3
  conversation:
    enabled: ${RATE_LIMIT_ENABLED:true}
    free:
      per-minute: 3
      per-hour: 10
    deluxe:
      per-minute: 10
      per-hour: 30
    premium:
      per-minute: 20
      per-hour: 60
